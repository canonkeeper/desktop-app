# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "canonkeeper-desktop-core"
version = "0.1.0"
description = "The CanonKeeper desktop shell without its window: the control channel, paths, words, navigation, the supervision of the backend and its updates"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
keyring = "4.2.0"
semver = "1"
# The updates of the app (specs/2026-11-13-desk-updates.md UB1, UB2): the network of an update with the TLS of the updater
# plugin, the minisign check the plugin uses, the kind of a Linux package, and the signer of a release (UB3) — Ed25519
# over BLAKE2b in the format of minisign — with the sums of its files (SHA256SUMS).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
minisign-verify = "0.3"
base64 = "0.23"
infer = "0.22"
ed25519-dalek = "2.2"
blake2 = "0.10"
sha2 = "0.10"
getrandom = "0.3"

[features]
# The smoke build of an update in CI (specs/2026-11-13-desk-updates.md UB3.7): the source of versions on the loopback and
# a key of one run, given when it is built; a release never carries it.
smoke = []

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The check of the locks of the installers of Debian is tested on real locks of each kind the system shows, POSIX and OFD
# among them (specs/2026-11-17-desk-update-linux.md UL2.1).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
