<!-- The page the shell carries (specs/2026-11-12-desk-shell.md SH1.5, SH2.1; specs/2026-11-13-desk-upgrade.md UG3;
     specs/2026-11-13-desk-updates.md UB0): what the window shows while the backend starts, during a long step of the
     start — the sign of work over its words (the board 44·39) — and when it cannot start: the window of the failure
     as the board 44·40 draws it. Its words and buttons come from the command of state of the shell, never from its
     address. It loads nothing but its own two files. -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CanonKeeper</title>
    <link rel="stylesheet" href="start.css" />
    <script src="start.js" defer></script>
  </head>
  <body>
    <main id="starting" class="sheet" aria-live="polite">
      <div class="loader" aria-hidden="true"></div>
      <p id="title" class="title">CanonKeeper запускается…</p>
      <p id="hint" class="hint" hidden>Первый запуск может занять до полуминуты.</p>
    </main>
    <main id="failure" class="dialog" role="alertdialog" aria-labelledby="failure-title" aria-describedby="words" hidden>
      <div class="head">
        <p id="failure-title" class="name">CanonKeeper</p>
        <button type="button" id="dismiss" class="icon" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <p id="words" class="words" role="alert"></p>
      <div id="way-out" class="way-out"></div>
      <div id="actions" class="actions"></div>
    </main>
    <main id="question" class="dialog" role="alertdialog" aria-labelledby="question-title" aria-describedby="question-text" hidden>
      <div class="head">
        <p id="question-title" class="name"></p>
        <button type="button" id="dismiss-question" class="icon" aria-label="Отмена">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <p id="question-text" class="words"></p>
      <ul id="earlier" class="earlier" hidden></ul>
      <div class="actions">
        <button type="button" id="cancel" class="quiet"></button>
        <button type="button" id="confirm"></button>
      </div>
    </main>
  </body>
</html>
