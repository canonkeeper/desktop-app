# Codex 0.167.2 would run the chat model from its built-in catalog: Responses Lite with one tool call
# per answer, code mode and terse answers. This catalog names no model in use, so the chat model runs
# on Codex fallback metadata as it did on 0.153.4: saga tools called directly and in parallel, the
# 1M window of the environment config (specs/2026-10-28-codex-0165.md).
model_catalog_json = "model-catalog.json"
model_reasoning_summary = "auto"
approval_policy = "never"
default_permissions = "canonkeeper-runtime"
web_search = "disabled"
project_root_markers = []

[output_truncation]
max_bytes = 3000000
max_lines = 5000
mcp_max_lines = 5000

[features]
goals = true
shell_tool = false
view_image = false
# The chat draws nothing: drawings are made in the drawing workshop, never by Codex itself.
image_generation = false
apps = false
enable_mcp_apps = false
plugins = false
tool_suggest = false
sleep_tool = false
# On by default since Codex 0.167: they let a thread start a turn by itself after turn/completed or start
# explorers, workflows and agent worktrees; a turn of CanonKeeper ends at turn/completed.
exec_exit_notifications = false
workflows = false
wake_on_agent_messages = false
explorer_profile = false
agent_worktree_isolation = false

# The agents stay off. Were they turned on, their tools would come under the new namespace of Codex 0.167,
# which it gives without tool_namespace only while agent_worktree_isolation is on.
[features.multi_agent_v2]
enabled = false
tool_namespace = "agents"

[agents]
enabled = false

[skills.bundled]
enabled = false

[tools.experimental_request_user_input]
enabled = false

[permissions.canonkeeper-runtime]
description = "Read only the runtime workspace root; network is disabled."

[permissions.canonkeeper-runtime.filesystem]
":workspace_roots" = "read"

[permissions.canonkeeper-runtime.network]
enabled = false
