# SPDX-License-Identifier: AGPL-3.0-only
# S0 probe of the CanonKeeper desktop app on free GitHub-hosted runners: PostgreSQL 18 from
# source, codex-app-server of the Codex fork behind a local gateway, the Tauri shell with a WebGL
# map page, ad-hoc signing and updates. Results: the `s0-results` artifact and the run summary.
name: S0 probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0-probe-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  forbidden:
    name: Forbidden content (generic rules)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -I scripts/check-forbidden.py --ci

  postgres:
    name: PostgreSQL 18 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: cache
        uses: actions/cache@v4
        with:
          path: pg-out
          key: pg-18.6-${{ matrix.os }}-${{ hashFiles('spike/postgres/**') }}
      - name: Build tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex
          pip install meson ninja patchelf
      - name: Build tools (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: pip install meson ninja
      - name: Build tools (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress
          pip install meson ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      - name: Build and package
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python -I spike/postgres/build.py pg-work pg-out
      - name: Pack (artifacts lose file modes, a tar keeps them)
        run: tar -cf pg-set.tar -C pg-out .
      - uses: actions/upload-artifact@v4
        with:
          name: pg-${{ matrix.os }}
          path: pg-set.tar
          retention-days: 7

  probe:
    name: Parts probe · ${{ matrix.os }}
    needs: postgres
    strategy:
      fail-fast: false
      matrix:
        # The Linux set of PostgreSQL is built on 22.04 (glibc 2.35) and also runs on 24.04.
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, pg: ubuntu-22.04 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, pg: ubuntu-22.04 }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, pg: windows-2025 }
          - { os: macos-15, target: aarch64-apple-darwin, pg: macos-15 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, pg: macos-15-intel }
    runs-on: ${{ matrix.os }}
    env:
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: spike/probe/go.mod
          cache-dependency-path: spike/*/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: pg-${{ matrix.pg }}
      - name: Unpack PostgreSQL and build the probe
        run: |
          mkdir -p pg-out results bin
          tar -xf pg-set.tar -C pg-out
          cp pg-out/build.json results/pg-build.json
          (cd spike/probe && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/bin/probe$EXE" .)
      - name: Fetch codex-app-server (pinned sha256)
        run: |
          python -I spike/codex/fetch.py ${{ matrix.target }} codex --with-bwrap
          cp codex/codex.json results/codex-package.json
      - name: PostgreSQL in the product data directory with a Cyrillic segment
        continue-on-error: true
        run: ./bin/probe$EXE pg -bin pg-out/pg/bin -out results/pg.json
      - name: PostgreSQL as a Windows user with a Cyrillic name
        continue-on-error: true
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'Тестер'
          $bytes = New-Object byte[] 18
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $plain = 'Aa1!' + [Convert]::ToBase64String($bytes)
          $secure = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $name -Password $secure -PasswordNeverExpires | Out-Null
          $root = 'C:\ckspike'
          New-Item -ItemType Directory -Force -Path $root, "$root\out" | Out-Null
          Copy-Item bin\probe.exe $root
          Copy-Item -Recurse pg-out\pg "$root\pg"
          icacls $root /grant '*S-1-5-32-545:(OI)(CI)RX' /T /Q | Out-Null
          icacls "$root\out" /grant "${name}:(OI)(CI)M" /Q | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential(".\$name", $secure)
          $arguments = @('pg', '-bin', "$root\pg\bin", '-out', "$root\out\pg-cyrillic-user.json")
          try {
            $p = Start-Process -FilePath "$root\probe.exe" -ArgumentList $arguments -Credential $cred -LoadUserProfile `
              -WorkingDirectory "$root\out" -Wait -PassThru -RedirectStandardError "$root\out\stderr.txt" -RedirectStandardOutput "$root\out\stdout.txt"
            "exit code: $($p.ExitCode)"
          } catch {
            "Start-Process -Credential failed: $_" | Tee-Object -FilePath results\pg-cyrillic-user-error.txt
          }
          Get-ChildItem "$root\out" | ForEach-Object { Copy-Item $_.FullName results\ }
          Get-Content "$root\out\stderr.txt" -ErrorAction SilentlyContinue
      - name: Codex turn through the gateway and the Chat Completions stub
        continue-on-error: true
        run: ./bin/probe$EXE codex -codex codex/codex-app-server$EXE -home spike/codex/home -out results/codex.json
      - name: Linux · outbound connections in a loopback-only network namespace (strace)
        continue-on-error: true
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq strace >/dev/null
          # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor; the runner is disposable.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          unshare -rn sh -c 'ip link set lo up && strace -f -qq -e trace=connect,execve -o results/codex-strace.txt \
            ./bin/probe codex -codex codex/codex-app-server -home spike/codex/home -label codex-netns -out results/codex-netns.json'
          ./bin/probe trace -in results/codex-strace.txt -out results/codex-strace.json
          rm results/codex-strace.txt
      - name: Linux · without bwrap
        continue-on-error: true
        if: runner.os == 'Linux'
        run: |
          if command -v bwrap; then echo present > results/bwrap-on-runner.txt; sudo mv "$(command -v bwrap)" /tmp/bwrap.off; else echo absent > results/bwrap-on-runner.txt; fi
          ./bin/probe codex -codex codex/codex-app-server -home spike/codex/home -label codex-nobwrap -out results/codex-nobwrap.json
      - name: macOS · signature of the release binary and a run under the hardened runtime (allow-jit)
        continue-on-error: true
        if: runner.os == 'macOS'
        run: |
          codesign -dv --verbose=2 codex/codex-app-server > results/codex-release-signature.txt 2>&1 || true
          cp codex/codex-app-server codex/codex-app-server-adhoc
          codesign --force --sign - codex/codex-app-server-adhoc
          ./bin/probe codex -codex codex/codex-app-server-adhoc -home spike/codex/home -label codex-adhoc -out results/codex-adhoc.json || true
          cp codex/codex-app-server codex/codex-app-server-hardened
          codesign --force --options runtime --sign - codex/codex-app-server-hardened
          ./bin/probe codex -codex codex/codex-app-server-hardened -home spike/codex/home -label codex-hardened -out results/codex-hardened.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-probe-${{ matrix.os }}
          path: results
          retention-days: 30

  shell:
    name: Tauri shell · ${{ matrix.os }}
    needs: postgres
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "deb,rpm,appimage", pg: ubuntu-22.04 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb,rpm,appimage", pg: ubuntu-22.04 }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, bundles: nsis, pg: windows-2025 }
          - { os: macos-15, target: aarch64-apple-darwin, bundles: "app,dmg", pg: macos-15 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg", pg: macos-15-intel }
    runs-on: ${{ matrix.os }}
    env:
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: spike/probe/go.mod
          cache-dependency-path: spike/*/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/shell/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/shell/src-tauri
      - name: Linux packages for WebKitGTK 4.1
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb rpm >/dev/null
      - name: Tools
        run: pip install psutil mss
      - uses: actions/download-artifact@v4
        with:
          name: pg-${{ matrix.pg }}
      - name: Parts into the bundle resources
        run: |
          mkdir -p results bin spike/shell/resources/pg
          tar -xf pg-set.tar -C spike/shell/resources/pg
          mv spike/shell/resources/pg/build.json results/pg-build.json
          mv spike/shell/resources/pg/pg/* spike/shell/resources/pg/ && rmdir spike/shell/resources/pg/pg
          python -I spike/codex/fetch.py ${{ matrix.target }} spike/shell/resources/codex
          mv spike/shell/resources/codex/codex.json results/codex-package.json
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - spike/shell/resources/codex/codex-app-server; fi
          (cd spike/probe && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/bin/probe$EXE" .)
      - name: Page, icons and an updater key made for this run only
        working-directory: spike/shell
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python -I ../tools/make_icon.py "$RUNNER_TEMP/icon.png"
          npx tauri icon "$RUNNER_TEMP/icon.png" > /dev/null
          npx tauri signer generate --ci -w "$RUNNER_TEMP/updater.key" > /dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/updater.key")" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
          python - "$RUNNER_TEMP/updater.key.pub" <<'EOF'
          import json, sys
          pubkey = open(sys.argv[1]).read().strip()
          updater = {"pubkey": pubkey, "endpoints": ["http://127.0.0.1:8765/latest.json"]}
          json.dump({"version": "0.1.0", "bundle": {"resources": {"../resources/pg": "pg", "../resources/codex": "codex"}},
                     "plugins": {"updater": updater}}, open("conf-full.json", "w"))
          json.dump({"version": "0.1.1", "plugins": {"updater": updater}}, open("conf-light.json", "w"))
          EOF
      - name: Build 0.1.0 with PostgreSQL and codex-app-server inside
        working-directory: spike/shell
        run: |
          start=$(date +%s)
          npx tauri build --config conf-full.json --bundles ${{ matrix.bundles }}
          echo "{\"tauri_build_seconds\": $(( $(date +%s) - start ))}" > "$GITHUB_WORKSPACE/results/build-time.json"
          cp -R src-tauri/target/release/bundle "$RUNNER_TEMP/bundle-0.1.0"
          ls -la src-tauri/target/release
      - name: Install (Linux · deb unpacked)
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -x "$RUNNER_TEMP"/bundle-0.1.0/deb/*.deb "$RUNNER_TEMP/installed"
          echo "APP_EXE=$RUNNER_TEMP/installed/usr/bin/canonkeeper-probe" >> "$GITHUB_ENV"
          echo "APP_RES=$RUNNER_TEMP/installed/usr/lib/CanonKeeper Probe" >> "$GITHUB_ENV"
          echo "APP_DIR=$RUNNER_TEMP/installed" >> "$GITHUB_ENV"
      - name: Install (macOS · from the dmg into ~/Applications)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls "$RUNNER_TEMP"/bundle-0.1.0/dmg/*.dmg)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3-)
          mkdir -p ~/Applications
          cp -R "$mount/CanonKeeper Probe.app" ~/Applications/
          hdiutil detach "$mount"
          app="$HOME/Applications/CanonKeeper Probe.app"
          echo "APP_EXE=$app/Contents/MacOS/canonkeeper-probe" >> "$GITHUB_ENV"
          echo "APP_RES=$app/Contents/Resources" >> "$GITHUB_ENV"
          echo "APP_DIR=$app" >> "$GITHUB_ENV"
      - name: Install (Windows · NSIS for the current user)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\bundle-0.1.0\nsis\*-setup.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'CanonKeeper Probe'
          $exe = Get-ChildItem "$dir\*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          Get-ChildItem $dir | Format-Table Name, Length
          "APP_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "APP_RES=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "APP_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Sizes
        run: python -I spike/tools/sizes.py --bundle "$RUNNER_TEMP/bundle-0.1.0" --installed "app=$APP_DIR" --installed "pg=$APP_RES/pg" --installed "codex=$APP_RES/codex" --out results/sizes.json
      - name: PostgreSQL and codex-app-server started from the installed bundle
        continue-on-error: true
        run: |
          ./bin/probe$EXE pg -bin "$APP_RES/pg/bin" -root "$RUNNER_TEMP/bundle-run/Тест" -out results/bundle-pg.json
          ./bin/probe$EXE codex -codex "$APP_RES/codex/codex-app-server$EXE" -home spike/codex/home -root "$RUNNER_TEMP/bundle-run/Тест" -out results/bundle-codex.json
      - name: macOS · ad-hoc signatures of the bundle
        continue-on-error: true
        if: runner.os == 'macOS'
        run: |
          {
            echo "## codesign --verify --deep --strict"
            codesign --verify --deep --strict --verbose=2 "$APP_DIR" 2>&1 && echo "verify: ok" || echo "verify: FAILED"
            echo "## Mach-O files"
            find "$APP_DIR" -type f | while read -r file; do
              if file "$file" | grep -q Mach-O; then
                echo "$file :: $(codesign -dv "$file" 2>&1 | grep -E '^(Signature|CodeDirectory|Format)' | tr '\n' ' ')"
              fi
            done
            echo "## spctl --assess (Gatekeeper, informational)"
            spctl --assess --type execute -vv "$APP_DIR" 2>&1 || true
            echo "## quarantine attributes after install from dmg: $(xattr -lr "$APP_DIR" 2>/dev/null | grep -c com.apple.quarantine || true)"
          } > results/macos-signature.txt
          cat results/macos-signature.txt
      - name: Window with the WebGL map page (first and repeat launch)
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            xvfb-run -a -s "-screen 0 1280x800x24" python -I spike/tools/shell_probe.py launch --exe "$APP_EXE" --out results/shell.json --screenshot results/shell.png
          else
            python -I spike/tools/shell_probe.py launch --exe "$APP_EXE" --out results/shell.json --screenshot results/shell.png
          fi
      - name: macOS · keychain item written by 0.1.0
        continue-on-error: true
        if: runner.os == 'macOS'
        run: |
          python -I spike/tools/shell_probe.py keychain --exe "$APP_EXE" --mode write --out results/keychain-write.json
          python -I spike/tools/shell_probe.py keychain --exe "$APP_EXE" --mode read --out results/keychain-read-0.1.0.json
      - name: Build the 0.1.1 update and its latest.json
        if: runner.os != 'Linux'
        working-directory: spike/shell
        run: |
          npx tauri build --config conf-light.json --bundles ${{ runner.os == 'macOS' && 'app' || 'nsis' }}
          mkdir -p "$RUNNER_TEMP/serve"
          python - "$RUNNER_TEMP/serve" ${{ matrix.target }} <<'EOF'
          import glob, json, os, shutil, sys
          serve, target = sys.argv[1], sys.argv[2]
          bundle = "src-tauri/target/release/bundle"
          if "apple" in target:
              artifact = glob.glob(f"{bundle}/macos/*.app.tar.gz")[0]
              name, keys = "update.app.tar.gz", ["darwin-" + target.split("-")[0], "darwin-" + target.split("-")[0] + "-app"]
          else:
              artifact = glob.glob(f"{bundle}/nsis/*_0.1.1_*-setup.exe")[0]
              name, keys = "update-setup.exe", ["windows-x86_64", "windows-x86_64-nsis"]
          shutil.copy(artifact, os.path.join(serve, name))
          signature = open(artifact + ".sig").read()
          entry = {"signature": signature, "url": f"http://127.0.0.1:8765/{name}"}
          latest = {"version": "0.1.1", "notes": "S0 probe update", "pub_date": "2026-11-08T00:00:00Z",
                    "platforms": {key: entry for key in keys}}
          json.dump(latest, open(os.path.join(serve, "latest.json"), "w"), indent=2)
          print(json.dumps(latest, indent=2)[:600])
          EOF
      - name: Update 0.1.0 → 0.1.1 through the updater from a local latest.json
        continue-on-error: true
        if: runner.os != 'Linux'
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/serve" > "$RUNNER_TEMP/serve.log" 2>&1 &
          sleep 2
          python -I spike/tools/shell_probe.py update --exe "$APP_EXE" --url http://127.0.0.1:8765/latest.json --out results/update.json
      - name: macOS · after the update — quarantine, signature, version, keychain
        continue-on-error: true
        if: runner.os == 'macOS'
        run: |
          {
            echo "version: $(plutil -extract CFBundleShortVersionString raw "$APP_DIR/Contents/Info.plist")"
            echo "quarantine attributes: $(xattr -lr "$APP_DIR" 2>/dev/null | grep -c com.apple.quarantine || true)"
            echo "all extended attributes:"; xattr -lr "$APP_DIR" 2>/dev/null | cut -c1-200 | sort | uniq -c | head -20
            codesign --verify --deep --strict --verbose=2 "$APP_DIR" 2>&1 && echo "verify: ok" || echo "verify: FAILED"
          } > results/macos-after-update.txt
          cat results/macos-after-update.txt
          python -I spike/tools/shell_probe.py keychain --exe "$APP_EXE" --mode read --out results/keychain-read-after-update.json
          python -I spike/tools/shell_probe.py launch --exe "$APP_EXE" --runs 1 --out results/shell-after-update.json
      - name: Windows · after the update — mark of the web, version
        continue-on-error: true
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(180)
          do {
            Start-Sleep 3
            $version = (Get-Item $env:APP_EXE).VersionInfo.ProductVersion
          } while ($version -notlike '0.1.1*' -and (Get-Date) -lt $deadline)
          $files = Get-ChildItem $env:TEMP -Recurse -Filter '*installer*.exe' -ErrorAction SilentlyContinue
          $report = [ordered]@{
            installed_version = $version
            downloaded_installers = @($files | ForEach-Object {
              [ordered]@{ path = $_.FullName.Replace($env:TEMP, '%TEMP%'); bytes = $_.Length
                streams = @(Get-Item -LiteralPath $_.FullName -Stream * | ForEach-Object Stream) }
            })
            installed_exe_streams = @(Get-Item -LiteralPath $env:APP_EXE -Stream * | ForEach-Object Stream)
          }
          $report | ConvertTo-Json -Depth 5 | Tee-Object -FilePath results\windows-after-update.json
          python -I spike/tools/shell_probe.py launch --exe "$env:APP_EXE" --runs 1 --out results/shell-after-update.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-shell-${{ matrix.os }}
          path: results
          retention-days: 30

  summary:
    name: Summary
    needs: [probe, shell]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-*
          path: results
      - run: mkdir -p results && python3 -I spike/tools/summarize.py results s0-summary.md && cat s0-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: s0-results
          path: |
            results
            s0-summary.md
          retention-days: 90
