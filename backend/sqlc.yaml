version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations"
    queries:
      - "db/queries/artifact_sources.sql"
      - "db/queries/author_materials.sql"
      - "db/queries/author_memory.sql"
      - "db/queries/auth.sql"
      - "db/queries/canon_source.sql"
      - "db/queries/canonical_search.sql"
      - "db/queries/chapter_drafts.sql"
      - "db/queries/chapter_navigation_search.sql"
      - "db/queries/canonical_indexing.sql"
      - "db/queries/codex_threads.sql"
      - "db/queries/chat_sessions.sql"
      - "db/queries/chat_turns.sql"
      - "db/queries/chat_turn_attachments.sql"
      - "db/queries/deletion_outbox.sql"
      - "db/queries/jobs.sql"
      - "db/queries/library.sql"
      - "db/queries/projects.sql"
      - "db/queries/personal_notes.sql"
      - "db/queries/retention.sql"
      - "db/queries/saga_memory.sql"
      - "db/queries/saga_search.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
